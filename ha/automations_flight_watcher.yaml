# Snapshot of the Flight Watcher automations on the Pako HI Home Assistant (/config/automations.yaml),
# taken 2026-11-06 for review and history (FW-0036). Not loaded by anything: the live copies are edited
# through the Home Assistant connector, never by hand. Redacted: webhook ids, email addresses. See ha/README.md.
- id: '1793300707198'
  alias: Flight Watcher FLICA alert to phone
  description: 'Critical push to Ryan''s iPhones whenever a new email lands in <redacted-email>
    (FLICA alert inbox, IMAP entry 00000000000000000000000000). Backup to the Gmail
    app ding, since FLICA SMS is broken. Silent when every pairing the email names
    touches, on any day of the trip (Nov 5), a day blocked on the schedule card or
    a VAC day (always, regardless of the Show VAC/blocked toggle). Nov 3 2026 (Ryan):
    message leads with layover, pairing, dates and captain from the Watcher''s pot
    / Tradeboard / finds data; FLICA''s own subject goes last.'
  triggers:
  - event_data:
      entry_id: 00000000000000000000000000
    event_type: imap_content
    note: Every mail in this dedicated inbox is a FLICA alert, so no sender filter.
    trigger: event
  conditions: []
  actions:
  - alias: Wait up to 90 s for the Watcher to know each trip's length (it reads the
      same email within seconds)
    wait_template: '{%- set txt = (trigger.event.data.subject | default('''')) ~ ''
      '' ~ (trigger.event.data.text | default('''')) -%}

      {%- set pids = txt | regex_findall(''([A-Z]\d{4}[A-Z]?):\d{2}[A-Za-z]{3}'')
      | unique | list -%}

      {%- set have = ((state_attr(''sensor.flight_watcher_pot_count'',''pairings'')
      or []) + (state_attr(''sensor.flight_watcher_tradeboard_pickups'',''pairings'')
      or []) + (state_attr(''sensor.flight_watcher_finds'',''finds'') or [])) | map(attribute=''pairing'')
      | list -%}

      {{ pids | reject(''in'', have) | list | count == 0 }}'
    timeout: 00:01:30
    continue_on_timeout: true
  - alias: 'Nov 5 (Ryan): skip when every trip in the email touches a blocked (unavailable)
      or VAC day on ANY day of the trip, not just its start'
    condition: template
    value_template: '{%- set txt = (trigger.event.data.subject | default('''')) ~
      '' '' ~ (trigger.event.data.text | default('''')) -%}

      {%- set keys = txt | regex_findall(''([A-Z]\d{4}[A-Z]?):(\d{2}[A-Za-z]{3})'')
      | unique | list -%}

      {%- set blocked = state_attr(''sensor.flight_watcher_blocked_days'',''days'')
      or [] -%}

      {%- set rows = (state_attr(''sensor.flight_watcher_pot_count'',''pairings'')
      or []) + (state_attr(''sensor.flight_watcher_tradeboard_pickups'',''pairings'')
      or []) + (state_attr(''sensor.flight_watcher_finds'',''finds'') or []) -%}

      {%- set ns = namespace(vacs=[], open=0, hit=false, r=none) -%}

      {%- for m in (state_attr(''sensor.flight_watcher_schedule'',''months'') or {}).values()
      -%}{%- set ns.vacs = ns.vacs + ((m[''items''] or []) | selectattr(''trip'',''eq'',''VAC'')
      | list) -%}{%- endfor -%}

      {%- for k in keys -%}

      {%- set pid = k[0] -%}{%- set sd = k[1] | title -%}

      {%- set dt = strptime(now().year ~ sd, ''%Y%d%b'', none) -%}

      {%- if dt and dt.month < now().month - 1 -%}{%- set dt = strptime((now().year
      + 1) ~ sd, ''%Y%d%b'', none) -%}{%- endif -%}

      {%- set cand = rows | selectattr(''pairing'',''eq'',pid) | list -%}

      {%- set ns.r = none -%}{%- for c in cand -%}{%- if ns.r is none and ((c.start
      | default('''', true)) ~ (c.dates | default('''', true))) | lower | regex_search(''^''
      ~ (sd | lower)) -%}{%- set ns.r = c -%}{%- endif -%}{%- endfor -%}

      {%- set r = ns.r if ns.r is not none else (cand | first | default(none)) -%}

      {%- set n = (r.days | default(0) | int(0)) if r else 0 -%}

      {%- if dt and n == 0 and r and (r.end | default('''', true)) -%}{%- set e =
      strptime(dt.year ~ (r.end | title), ''%Y%d%b'', none) -%}{%- set n = ((e - dt).days
      + 1) if e and e >= dt else 1 -%}{%- endif -%}

      {%- set ns.hit = false -%}

      {%- if dt -%}{%- for i in range([n, 1] | max) -%}{%- set iso = (dt + timedelta(days=i)).strftime(''%Y-%m-%d'')
      -%}

      {%- if iso in blocked or ns.vacs | selectattr(''start'',''le'',iso) | selectattr(''end'',''ge'',iso)
      | list | count > 0 -%}{%- set ns.hit = true -%}{%- endif -%}

      {%- endfor -%}{%- endif -%}

      {%- if not ns.hit -%}{%- set ns.open = ns.open + 1 -%}{%- endif -%}

      {%- endfor -%}

      {{ keys | count == 0 or ns.open > 0 }}'
  - variables:
      folders: '{%- set txt = trigger.event.data.text | default('''') -%}{{ txt |
        regex_findall("from ''([^'']+?)( - [A-Z][a-z]+)?''") | map(''first'') | map(''replace'',
        ''OPEN TIME- Add/Swap/Drop requests'', ''Open time'') | map(''replace'', ''Close
        in Opentime: &lt;16 Hrs to RPT'', ''Close-in'') | map(''replace'', ''Close
        in Opentime: <16 Hrs to RPT'', ''Close-in'') | unique | list }}'
      keys: '{%- set txt = (trigger.event.data.subject | default('''')) ~ '' '' ~
        (trigger.event.data.text | default('''')) -%}{{ txt | regex_findall(''([A-Z]\\d{4}[A-Z]?:\\d{2}[A-Za-z]{3})'')
        | unique | list }}'
      lines: '{%- set ns = namespace(out=[]) -%}

        {%- set pot = (state_attr(''sensor.flight_watcher_pot_count'',''pairings'')
        or []) + (state_attr(''sensor.flight_watcher_tradeboard_pickups'',''pairings'')
        or []) -%}

        {%- set finds = state_attr(''sensor.flight_watcher_finds'',''finds'') or []
        -%}

        {%- for k in keys -%}

        {%- set pid = k.split('':'')[0] -%}{%- set sd = k.split('':'')[1] -%}{%- set
        sdn = (sd[2:5] | capitalize) ~ '' '' ~ (sd[:2] | int) -%}

        {%- set p = (pot | selectattr(''pairing'',''eq'',pid) | list | first) or (finds
        | selectattr(''pairing'',''eq'',pid) | list | first) or none -%}

        {%- if p -%}

        {%- set lay = p.layover if p.layover not in [none,'''',''-none-''] else (p.turn
        ~ '' turn'' if p.turn else ''?'') -%}

        {%- set dates = p.dates | default('''', true) -%}{%- set dates = ((dates[2:5]
        | capitalize) ~ '' '' ~ (dates[:2] | int) ~ (''-'' ~ (dates[6:8] | int) if
        dates | length > 5 else '''')) if dates else sdn -%}

        {%- set ca = p.captain | default('''', true) -%}

        {%- set ns.out = ns.out + [lay ~ ''  '' ~ pid ~ ''  '' ~ dates ~ ('' ('' ~
        p.days ~ '' d, '' ~ p.credit ~ '')'' if p.days and p.credit else '''') ~ ''\nCA
        '' ~ (ca if ca else ''?'')] -%}

        {%- else -%}

        {%- set ns.out = ns.out + [pid ~ ''  '' ~ sdn ~ ''  (no details yet)''] -%}

        {%- endif -%}

        {%- endfor -%}

        {{ ns.out | join(''\n'') }}'
      req: '{{ (trigger.event.data.subject | default('''')) | regex_findall("alert
        request ''([^'']+)''") | first | default('''') }}'
      subject: '{{ trigger.event.data.subject | default(''FLICA alert'') }}'
  - variables:
      msg: '{{ lines }}{{ ''\nIn: '' ~ (folders | join('', '')) if folders | count
        else '''' }}{{ ''\nFLICA request: '' ~ req if req else '''' }}{% if keys |
        count == 0 %}{{ subject }}\n{{ trigger.event.data.text | default('''') | truncate(200)
        }}{% endif %}'
      title: '{%- set pot = (state_attr(''sensor.flight_watcher_pot_count'',''pairings'')
        or []) + (state_attr(''sensor.flight_watcher_tradeboard_pickups'',''pairings'')
        or []) + (state_attr(''sensor.flight_watcher_finds'',''finds'') or []) -%}{%-
        if keys | count == 1 -%}{%- set pid = keys[0].split('':'')[0] -%}{%- set sd
        = keys[0].split('':'')[1] -%}{%- set sdn = (sd[2:5] | capitalize) ~ '' ''
        ~ (sd[:2] | int) -%}{%- set p = pot | selectattr(''pairing'',''eq'',pid) |
        list | first | default(none) -%}{%- set lay = (p.layover if p and p.layover
        not in [none,'''',''-none-''] else (p.turn if p and p.turn else '''')) -%}FLICA:
        {{ lay ~ '' '' if lay else '''' }}{{ pid }} {{ sdn }}{%- else -%}FLICA: {{
        keys | count }} trips{{ '' for '' ~ req if req else '''' }}{%- endif -%}'
  - parallel:
    - action: notify.mobile_app_ryans_iphone
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: critical
            sound:
              critical: 1
              name: default
              volume: 1
          url: https://ha2.flica.net/online/mainmenu.cgi
        message: '{{ msg }}'
        title: '{{ title }}'
    - action: notify.mobile_app_ryans_iphone_16
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: critical
            sound:
              critical: 1
              name: default
              volume: 1
          url: https://ha2.flica.net/online/mainmenu.cgi
        message: '{{ msg }}'
        title: '{{ title }}'
  max: 10
  mode: parallel
- id: '1793352453467'
  alias: Flight Watcher new pairing
  description: 'Critical push when the Flight Watcher add-on sees a pairing added
    to the HNL/332/FO open time pot. 0.3.6: a no-layover turn shows its station in
    the title, e.g. **PPG**. 0.4.4: silent for trips touching VAC or blocked days;
    the Show VAC/blocked toggle only affects the dashboard (per Ryan, Nov 1). Nov
    4: silent when the trip conflicts with his own schedule or fails the FAR 117 screen
    (he is not legal to take it anyway). FW-0054 (Nov 6): a trip he can take buzzes
    (flight-watcher-buzzer.wav, served at /local/; iOS plays the default sound until
    it is imported in the Home Assistant app). FW-0042 (Nov 11, Ryan: show only):
    the message adds the commute result and the pairing value from the event (comm,
    value; comm_why too when 60 characters or less), e.g. ''Commute: KOA/ITO'' and
    ''Value: 4617'', each left out when blank. Nothing is silenced by them. 1.7.1
    (FW-0042 part 2, show only): and the 98 h in 672 h block tag of the find (its
    month_rule part, else b672 / b672_ok), e.g. ''Fits 672 (97:59)'', ''Over 98/672
    (98:01)'' or ''672 ? (block not read)'', left out when blank.'
  triggers:
  - topic: flight_watcher/event/new_pairing
    trigger: mqtt
  conditions:
  - condition: template
    alias: Skip trips touching VAC or blocked days (the Show VAC/blocked toggle is
      display only)
    value_template: '{{ not (trigger.payload_json.vac | default(false)) and not (trigger.payload_json.blocked
      | default(false)) }}'
  - condition: template
    alias: 'Skip trips Ryan cannot legally take (Nov 4, Ryan): fit says Conflict,
      or the FAR 117 screen is not OK (Conflict, rest, 30 in 7, 100 in 672). ''?''
      (times not read yet) still pushes.'
    value_template: '{% set fit = trigger.payload_json.fit | default('''') %}{% set
      far = trigger.payload_json.far | default('''') %}{{ not fit.startswith(''Conflict'')
      and (far in ['''', ''?''] or far.startswith(''OK'')) }}'
  actions:
  - variables:
      p: '{{ trigger.payload_json }}'
  - variables:
      msg: '{% set y = now().year %}{% set s = strptime(p.start ~ y, ''%d%b%Y'', none)
        %}{% set e = strptime((p.end or p.start) ~ y, ''%d%b%Y'', none) %}{% if s
        %}{{ s.strftime(''%a'')[:2] }} {{ s.strftime(''%b'') }} {{ s.day }}{% if e
        and e != s %} - {{ e.strftime(''%a'')[:2] }} {{ e.strftime(''%b'') }} {{ e.day
        }}{% endif %}{% else %}{{ p.dates }}{% endif %}{% set ca = (p.captain or '''')
        %}{% if ca %} | {{ ''OPEN'' if ca == ''OPEN'' else ca.split('', '')[0] }}{%
        endif %}

        {% set d = strptime(p.depart or '''', ''%H:%M'', none) %}{% set a = strptime(p.arrive
        or '''', ''%H:%M'', none) %}Dep {{ d.strftime(''%-I:%M%p'').lower() if d else
        ''?'' }} - Ret {{ a.strftime(''%-I:%M%p'').lower() if a else ''?'' }}

        Cr {{ p.credit }} | ST {{ p.soft if p.soft else ''?'' }}{% if p.fit is defined
        and p.fit %} | {{ p.fit }}{% endif %}{% set cm = p.comm if p.comm is defined
        and p.comm else '''' %}{% set cw = p.comm_why if p.comm_why is defined and
        p.comm_why else '''' %}{% if cm %}

        Commute: {{ cm }}{% if cw and cw | length <= 60 %} ({{ cw }}){% endif %}{%
        endif %}{% set v = p.value if p.value is defined and p.value is not none else
        '''' %}{% if v | string %}

        Value: {{ v }}{% endif %}{% set ns = namespace(t='''') %}{% for x in (p.month_rule
        if p.month_rule is defined and p.month_rule else '''').split('', '') %}{%
        if not ns.t and x.startswith((''Fits 672'', ''Over 98/672'', ''672 ?'')) %}{%
        set ns.t = x %}{% endif %}{% endfor %}{% set b = p.b672 if p.b672 is defined
        and p.b672 else '''' %}{% set ok = p.b672_ok if p.b672_ok is defined else
        '''' %}{% if not ns.t and b and ok is sameas true %}{% set ns.t = ''Fits 672
        ('' ~ b ~ '')'' %}{% elif not ns.t and b and ok is sameas false %}{% set ns.t
        = ''Over 98/672 ('' ~ b ~ '')'' %}{% endif %}{% if ns.t %}

        {{ ns.t }}{% endif %}'
  - parallel:
    - action: notify.mobile_app_ryans_iphone
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: critical
            sound:
              critical: 1
              name: flight-watcher-buzzer.wav
              volume: 1
          tag: flight_watcher_{{ p.source | default('pot') }}_{{ p.pairing }}_{{ p.start
            }}{% if p.practice is defined %}_practice_{{ now().timestamp() | int }}{%
            endif %}
          url: '{{ p.detail_url if p.detail_url is defined else ''https://ha2.flica.net/online/mainmenu.cgi''
            }}'
        message: '{{ msg }}'
        title: '{% if p.practice is defined %}PRACTICE {% endif %}{{ ''Tradeboard
          Pick Up'' if p.source is defined and p.source == ''tradeboard'' else ''***''
          }} {{ p.layover if p.layover not in [''-none-'',''''] else (''**'' ~ p.turn
          ~ ''**'' if p.turn is defined and p.turn else ''Turn'') }} {{ p.days }}-day
          {{ p.pairing }}'
    - action: notify.mobile_app_ryans_iphone_16
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: critical
            sound:
              critical: 1
              name: flight-watcher-buzzer.wav
              volume: 1
          tag: flight_watcher_{{ p.source | default('pot') }}_{{ p.pairing }}_{{ p.start
            }}{% if p.practice is defined %}_practice_{{ now().timestamp() | int }}{%
            endif %}
          url: '{{ p.detail_url if p.detail_url is defined else ''https://ha2.flica.net/online/mainmenu.cgi''
            }}'
        message: '{{ msg }}'
        title: '{% if p.practice is defined %}PRACTICE {% endif %}{{ ''Tradeboard
          Pick Up'' if p.source is defined and p.source == ''tradeboard'' else ''***''
          }} {{ p.layover if p.layover not in [''-none-'',''''] else (''**'' ~ p.turn
          ~ ''**'' if p.turn is defined and p.turn else ''Turn'') }} {{ p.days }}-day
          {{ p.pairing }}'
  max: 20
  mode: queued
- id: '1793470160223'
  alias: Flight Watcher needs you
  description: Time-sensitive push when the Flight Watcher parks itself (login failed
    or something unexpected). Routine yields/expiries stay in the add-on log.
  triggers:
  - entity_id: sensor.flight_watcher_state
    to:
    - stopped_login_failed
    - stopped_unexpected
    trigger: state
  actions:
  - parallel:
    - action: notify.mobile_app_ryans_iphone
      continue_on_error: true
      data:
        data:
          actions:
          - action: FLIGHT_WATCHER_REARM
            title: Re-arm
          push:
            interruption-level: time-sensitive
          tag: flight_watcher_stopped
        message: 'State: {{ trigger.to_state.state }}. Check the Flight Watcher add-on
          log, fix, then press Re-arm.'
        title: Flight Watcher stopped
    - action: notify.mobile_app_ryans_iphone_16
      continue_on_error: true
      data:
        data:
          actions:
          - action: FLIGHT_WATCHER_REARM
            title: Re-arm
          push:
            interruption-level: time-sensitive
          tag: flight_watcher_stopped
        message: 'State: {{ trigger.to_state.state }}. Check the Flight Watcher add-on
          log, fix, then press Re-arm.'
        title: Flight Watcher stopped
  mode: single
- id: '1793470165322'
  alias: Flight Watcher re-arm from push
  description: Re-arm button on the 'Flight Watcher stopped' push presses button.flight_watcher_re_arm.
  triggers:
  - event_data:
      action: FLIGHT_WATCHER_REARM
    event_type: mobile_app_notification_action
    trigger: event
  actions:
  - action: button.press
    target:
      entity_id: button.flight_watcher_re_arm
  mode: single
- id: '1793470168710'
  alias: Flight Watcher down
  description: One push if the Flight Watcher add-on has been offline (MQTT LWT) for
    5 min. Supervisor watchdog restarts it first; this fires only if self-healing
    failed.
  triggers:
  - entity_id: sensor.flight_watcher_state
    for:
      minutes: 5
    to: unavailable
    trigger: state
  actions:
  - action: notify.mobile_app_ryans_iphone
    continue_on_error: true
    data:
      data:
        tag: flight_watcher_down
      message: The add-on has been offline 5 min and did not restart on its own.
      title: Flight Watcher down
  - action: notify.mobile_app_ryans_iphone_16
    continue_on_error: true
    data:
      data:
        tag: flight_watcher_down
      message: The add-on has been offline 5 min and did not restart on its own.
      title: Flight Watcher down
  mode: single
- id: '1793478226336'
  alias: Flight Watcher heartbeat stale
  description: 'One push when the Watcher says idle or hunting but has not checked
    the pot for 30 min, or 2.5x the normal check interval when that is longer (0.3.5:
    was 15 min, which a 20 min interval +-30 % could trip). Skips paused, yielded,
    backoff and stopped states, which have their own handling. HOM t1218.'
  triggers:
  - trigger: template
    value_template: '{% set lc = states(''sensor.flight_watcher_last_check'') %}{%
      set limit = [30, (states(''number.flight_watcher_normal_check_every'') | float(20))
      * 2.5] | max %}{{ lc not in [''unknown'', ''unavailable''] and as_datetime(lc)
      is not none and now() - as_datetime(lc) > timedelta(minutes=limit) }}'
  conditions:
  - condition: state
    entity_id: switch.flight_watcher_pause
    state: 'off'
  - condition: state
    entity_id: sensor.flight_watcher_state
    state:
    - idle
    - hunting
  actions:
  - parallel:
    - action: notify.mobile_app_ryans_iphone_16
      continue_on_error: true
      data:
        data:
          actions:
          - action: FLIGHT_WATCHER_REARM
            title: Re-arm
          tag: flight_watcher_stale
        message: '{{ states(''sensor.flight_watcher_state'') | capitalize }} but no
          pot check for {{ ((now() - as_datetime(states(''sensor.flight_watcher_last_check''))).total_seconds()
          / 60) | round(0) | int }} min. Tap Re-arm or restart the app.'
        title: Flight Watcher blind
    - action: notify.mobile_app_ryans_iphone
      continue_on_error: true
      data:
        data:
          actions:
          - action: FLIGHT_WATCHER_REARM
            title: Re-arm
          tag: flight_watcher_stale
        message: '{{ states(''sensor.flight_watcher_state'') | capitalize }} but no
          pot check for {{ ((now() - as_datetime(states(''sensor.flight_watcher_last_check''))).total_seconds()
          / 60) | round(0) | int }} min. Tap Re-arm or restart the app.'
        title: Flight Watcher blind
  mode: single
- id: '1793493329647'
  alias: Flight Watcher dashboard month reset
  description: On the 1st of each month, point the Flight Watcher page back at the
    current month (input_number.flight_watcher_month_offset = 0). HOM t1218. James's
    HA page was retired on 2026-11-10 (he uses the portal, where the month is view
    state).
  triggers:
  - at: 00:01:00
    trigger: time
  conditions:
  - condition: template
    value_template: '{{ now().day == 1 }}'
  actions:
  - action: input_number.set_value
    data:
      value: 0
    target:
      entity_id:
      - input_number.flight_watcher_month_offset
  mode: single
- id: '1793585834839'
  alias: Flight Watcher FLICA alert email in
  description: Forwards every FLICA alert email (<redacted-email>, IMAP entry
    00000000000000000000000000) to the Flight Watcher over MQTT, so pairings the pot
    watch missed between checks still land in Recently added (app 0.4.1+). Pushes
    stay with 'Flight Watcher FLICA alert to phone'.
  triggers:
  - event_data:
      entry_id: 00000000000000000000000000
    event_type: imap_content
    trigger: event
  actions:
  - action: mqtt.publish
    data:
      payload: '{{ {''subject'': trigger.event.data.subject | default(''''), ''text'':
        (trigger.event.data.text | default(''''))[:6000], ''date'': (trigger.event.data.date
        | default(now())) | string} | to_json }}'
      retain: false
      topic: flight_watcher/email/alert
  max: 20
  mode: queued
- id: '1793586673369'
  alias: Flight Watcher hidden trip
  description: 'Critical push (full-volume ding) when the Flight Watcher sees a trip
    leave the open time pot while its FO/RO seat still reads Open on the pairing page
    (suspected hidden by scheduling). App 0.4.3+ publishes flight_watcher/event/hidden
    once per trip. 0.4.4: silent for trips touching VAC or blocked days; the Show
    VAC/blocked toggle only affects the dashboard (per Ryan, Nov 1).'
  triggers:
  - topic: flight_watcher/event/hidden
    trigger: mqtt
  conditions:
  - condition: template
    alias: Skip trips touching VAC or blocked days (the Show VAC/blocked toggle is
      display only)
    value_template: '{{ not (trigger.payload_json.vac | default(false)) and not (trigger.payload_json.blocked
      | default(false)) }}'
  actions:
  - variables:
      p: '{{ trigger.payload_json }}'
  - variables:
      lay: '{{ p.layover if p.layover not in [none, '''', ''-none-''] else (''**''
        ~ p.turn ~ ''**'' if p.turn else ''Turn'') }}'
  - variables:
      msg: '{% set y = now().year %}{% set s = strptime((p.start or '''') ~ y, ''%d%b%Y'',
        none) %}{% set e = strptime((p.end or p.start or '''') ~ y, ''%d%b%Y'', none)
        %}{% if s %}{{ s.strftime(''%a'')[:2] }} {{ s.strftime(''%b'') }} {{ s.day
        }}{% if e and e != s %} - {{ e.strftime(''%a'')[:2] }} {{ e.strftime(''%b'')
        }} {{ e.day }}{% endif %}{% else %}{{ p.dates }}{% endif %}{% if p.captain
        %} | {{ p.captain.split('', '')[0] }}{% endif %}

        Seat still open, gone from the pot

        Cr {{ p.credit or ''?'' }}'
      title: '***HIDDEN*** {{ lay }} {{ p.days or ''?'' }}-day {{ p.pairing }}'
  - parallel:
    - action: notify.mobile_app_ryans_iphone_16
      continue_on_error: true
      data:
        data:
          push:
