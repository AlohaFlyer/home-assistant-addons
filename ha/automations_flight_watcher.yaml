- id: '1793914913300'
  alias: Flight Watcher recall list in (Hark webhook)
  description: 'Hark posts the daily HNL recall list from Flight Ops SharePoint; forwarded
    to the Watcher (recall.py, PWA 22.G.2 / FAR 117). Also forwarded to James''s Watcher
    (flight_watcher_james/recall/set): the list is the same for both; each Watcher
    judges misses for its own pilot and pushes only its own pilot (FW-0038).'
  triggers:
  - allowed_methods:
    - POST
    local_only: false
    trigger: webhook
    webhook_id: '<redacted>'
  actions:
  - action: mqtt.publish
    data:
      payload: '{%- set j = trigger.json -%}{%- set days = j if j is list else [j]
        -%}{%- set ns = namespace(out=[]) -%}{%- for d in days -%}{%- set nr = namespace(rows=[])
        -%}{%- for r in d.rows | default([]) -%}{%- set nr.rows = nr.rows + [dict({''date'':
        d.date}, **r)] -%}{%- endfor -%}{%- set ns.out = ns.out + [dict(d, rows=nr.rows)]
        -%}{%- endfor -%}{{ (ns.out if j is list else ns.out[0]) | tojson }}'
      topic: flight_watcher/recall/set
  - action: mqtt.publish
    data:
      payload: '{%- set j = trigger.json -%}{%- set days = j if j is list else [j]
        -%}{%- set ns = namespace(out=[]) -%}{%- for d in days -%}{%- set nr = namespace(rows=[])
        -%}{%- for r in d.rows | default([]) -%}{%- set nr.rows = nr.rows + [dict({''date'':
        d.date}, **r)] -%}{%- endfor -%}{%- set ns.out = ns.out + [dict(d, rows=nr.rows)]
        -%}{%- endfor -%}{{ (ns.out if j is list else ns.out[0]) | tojson }}'
      topic: flight_watcher_james/recall/set
    continue_on_error: true
  mode: queued
- id: '1793914999001'
  alias: Flight Watcher recall miss alert
  description: Pushes each possible missed Recall / Over 75 with Confirm / Not a miss
    buttons; the answer goes back to the Watcher (recall.py).
  triggers:
  - trigger: mqtt
    topic: flight_watcher/event/recall_miss
    id: miss
  - trigger: event
    event_type: mobile_app_notification_action
    id: act
  conditions:
  - condition: template
    value_template: '{{ (trigger.id == ''miss'' and trigger.payload_json.verdict ==
      ''MISSED'') or (trigger.id == ''act'' and (trigger.event.data.action | default('''')).startswith(''RECALL_''))
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: miss
      sequence:
      - variables:
          ev: '{{ trigger.payload_json }}'
      - parallel:
        - action: notify.mobile_app_ryans_iphone
          data:
            title: '{{ ''RED ALERT: missed '' if ev.verdict == ''MISSED'' else ''Possible
              missed '' }}{{ ''Over 75'' if ev.kind == ''o75'' else ''Recall'' }}
              {{ ev.pairing }}'
            message: '{{ ev.date }}: {{ ev.why }}'
            data:
              tag: recall-{{ ev.date }}-{{ ev.pairing }}
              url: /flight-watcher/recall
              push:
                interruption-level: time-sensitive
              actions:
              - action: RECALL_CONFIRM|{{ ev.id }}
                title: Yes, I missed it
              - action: RECALL_DISMISS|{{ ev.id }}
                title: Not a miss
              - action: URI
                title: Review
                uri: /flight-watcher/recall
          continue_on_error: true
        - action: notify.mobile_app_ryans_iphone_16
          data:
            title: '{{ ''RED ALERT: missed '' if ev.verdict == ''MISSED'' else ''Possible
              missed '' }}{{ ''Over 75'' if ev.kind == ''o75'' else ''Recall'' }}
              {{ ev.pairing }}'
            message: '{{ ev.date }}: {{ ev.why }}'
            data:
              tag: recall-{{ ev.date }}-{{ ev.pairing }}
              url: /flight-watcher/recall
              push:
                interruption-level: time-sensitive
              actions:
              - action: RECALL_CONFIRM|{{ ev.id }}
                title: Yes, I missed it
              - action: RECALL_DISMISS|{{ ev.id }}
                title: Not a miss
              - action: URI
                title: Review
                uri: /flight-watcher/recall
          continue_on_error: true
    - conditions:
      - condition: trigger
        id: act
      sequence:
      - action: mqtt.publish
        data:
          topic: flight_watcher/recall/act
          payload: '{{ {''id'': trigger.event.data.action.split(''|'', 1)[1], ''action'':
            ''confirm'' if trigger.event.data.action.startswith(''RECALL_CONFIRM'')
            else ''dismiss''} | tojson }}'
  mode: queued
- id: '1793915999002'
  alias: Flight Watcher new ticket
  description: 'Pushes Ryan each new bug report or feature request (FW-nnnn) filed
    on his own dashboard. Push isolation (Ryan, FW-0038): James''s instance (flight_watcher_james)
