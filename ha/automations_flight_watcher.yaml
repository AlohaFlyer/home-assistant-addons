- id: '1793941354206'
  alias: Flight Watcher request decided
  description: 'Time-sensitive push when a FLICA open time request Ryan filed (swap,
    add or drop) is Approved or Denied. Title: what was given and taken (H3629 ->
    H3628) and, when approved, the Pay-Gross added or given up (credit x PWA 3.D.6
    rate + PWA 4.O.1 overrides, the schedule card''s rules). Body: each trip''s credit
    and gross, FLICA''s crew scheduling reason when denied (1.3.1+), and the filing
    time. FW-0064 (1.4.7): also a crew-to-crew trade seen only on the schedule (key
    sched:..., source schedule): the body then says when FLICA showed it instead of
    a filing time. Push isolation (FW-0038): Ryan''s prefix only, to Ryan''s phones
    only.'
  triggers:
  - topic: flight_watcher/event/request_decided
    trigger: mqtt
  actions:
  - variables:
      p: '{{ trigger.payload_json }}'
  - variables:
      route: '{%- set pr = p.pay.parts if (p.pay and p.pay.parts) else [] -%}{%- set
        g = pr | selectattr(''side'',''eq'',''drop'') | map(attribute=''trip'') |
        list -%}{%- set t = pr | selectattr(''side'',''eq'',''add'') | map(attribute=''trip'')
        | list -%}{%- if g and t -%}{{ g | join('', '') }} → {{ t | join('', '') }}{%-
        elif g -%}gave {{ g | join('', '') }}{%- elif t -%}took {{ t | join('', '')
        }}{%- elif ''Swap'' in p.type and (p.trips | count) > 1 -%}{{ p.trips[0] }}
        → {{ p.trips[1:] | join('', '') }}{%- else -%}{{ p.trips | join('' / '') }}{%-
        endif -%}'
  - variables:
      title: '{{ ''✅'' if p.status == ''Approved'' else ''❌'' }} {{ p.type }} {{ p.status
        | lower }}{{ '': '' ~ route if route else '''' }}{{ '' · '' ~ p.pay.delta_text
        ~ '' Pay-Gross'' if p.status == ''Approved'' and p.pay else '''' }}'
      msg: '{%- if p.status == ''Approved'' and p.pay -%}Pay-Gross {{ p.pay.delta_text
        }}: {% for x in p.pay.parts %}{{ ''gave'' if x.side == ''drop'' else ''took''
        }} {{ x.trip }} {{ x.credit }} = ${{ ''{:,.0f}''.format(x.gross) }}{{ '',
        '' if not loop.last }}{% endfor %} at ${{ ''%.2f'' | format(p.pay.rate) }}/cr
        h (PWA 3.D.6, year {{ p.pay.year }}).

        {% elif p.status == ''Approved'' %}Pay-Gross not priced (trip not in the pairing
        package or no rate on file).

        {% endif %}{% if p.reason %}Why: {{ p.reason }}

        {% endif %}{% if (p.key | default('''') | string).startswith(''sched:'') %}Seen
        on your FLICA schedule {{ p.date }} {{ p.time }} HST; no request on file (a
        crew-to-crew trade).{% else %}Filed {{ p.date }} {{ p.time }} HST{{ '' (approval
        seen on your schedule)'' if p.source | default('''') == ''schedule'' else
        '''' }}.{% endif %}'
  - parallel:
    - action: notify.mobile_app_ryans_iphone_16
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: time-sensitive
          tag: flight_watcher_req_{{ p.key | replace('/', '') | replace('|', '_')
            | replace(':', '') }}
          url: https://ha2.flica.net/online/mainmenu.cgi
        message: '{{ msg }}'
        title: '{{ title }}'
    - action: notify.mobile_app_ryans_iphone
      continue_on_error: true
      data:
        data:
          push:
            interruption-level: time-sensitive
          tag: flight_watcher_req_{{ p.key | replace('/', '') | replace('|', '_')
            | replace(':', '') }}
          url: https://ha2.flica.net/online/mainmenu.cgi
        message: '{{ msg }}'
        title: '{{ title }}'
  max: 10
  mode: queued
