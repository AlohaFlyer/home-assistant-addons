- id: '1793914999001'
  alias: Flight Watcher recall miss alert
  description: 'Pushes each missed Recall / Over 75 with Confirm / Not a miss buttons;
    the answer goes back to the Watcher (recall.py). 1.4.6 (Ryan, Nov 6): a MISSED
    row is a critical push (RECALL ALERT, sound at full volume through silent mode);
    POSSIBLE would be time-sensitive.'
  triggers:
  - id: miss
    topic: flight_watcher/event/recall_miss
    trigger: mqtt
  - event_type: mobile_app_notification_action
    id: act
    trigger: event
  conditions:
  - condition: template
    value_template: '{{ (trigger.id == ''miss'' and trigger.payload_json.verdict ==
      ''MISSED'') or (trigger.id == ''act'' and (trigger.event.data.action | default('''')).startswith(''RECALL_''))
      }}'
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: miss
      sequence:
      - variables:
          ev: '{{ trigger.payload_json }}'
          push: '{{ {''interruption-level'': ''critical'', ''sound'': {''name'': ''default'',
            ''critical'': 1, ''volume'': 1}} if ev.verdict == ''MISSED'' else {''interruption-level'':
            ''time-sensitive''} }}'
      - parallel:
        - action: notify.mobile_app_ryans_iphone
          continue_on_error: true
          data:
            data:
              actions:
              - action: RECALL_CONFIRM|{{ ev.id }}
                title: Yes, I missed it
              - action: RECALL_DISMISS|{{ ev.id }}
                title: Not a miss
              - action: URI
                title: Review
                uri: /flight-watcher/recall
              push: '{{ push }}'
              tag: recall-{{ ev.date }}-{{ ev.pairing }}
              url: /flight-watcher/recall
            message: '{{ ev.date }}: {{ ev.why }}'
            title: '{{ ''RECALL ALERT: missed '' if ev.verdict == ''MISSED'' else
              ''Possible missed '' }}{{ ''Over 75'' if ev.kind == ''o75'' else ''Recall''
              }} {{ ev.pairing }}'
        - action: notify.mobile_app_ryans_iphone_16
          continue_on_error: true
          data:
            data:
              actions:
              - action: RECALL_CONFIRM|{{ ev.id }}
                title: Yes, I missed it
              - action: RECALL_DISMISS|{{ ev.id }}
                title: Not a miss
              - action: URI
                title: Review
                uri: /flight-watcher/recall
              push: '{{ push }}'
              tag: recall-{{ ev.date }}-{{ ev.pairing }}
              url: /flight-watcher/recall
            message: '{{ ev.date }}: {{ ev.why }}'
            title: '{{ ''RECALL ALERT: missed '' if ev.verdict == ''MISSED'' else
              ''Possible missed '' }}{{ ''Over 75'' if ev.kind == ''o75'' else ''Recall''
              }} {{ ev.pairing }}'
    - conditions:
      - condition: trigger
        id: act
      sequence:
      - action: mqtt.publish
        data:
          payload: '{{ {''id'': trigger.event.data.action.split(''|'', 1)[1], ''action'':
            ''confirm'' if trigger.event.data.action.startswith(''RECALL_CONFIRM'')
            else ''dismiss''} | tojson }}'
          topic: flight_watcher/recall/act
  mode: queued
