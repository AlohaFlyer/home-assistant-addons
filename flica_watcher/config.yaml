name: Old Flight Watcher (hand-off)
slug: flica_watcher
version: "0.10.4"
description: "Retired: copies its data to /share for the new Flight Watcher app, then waits. Uninstall after the move."
url: https://github.com/AlohaFlyer/home-assistant-addons/tree/main/flica_watcher
arch:
  - amd64
init: false
startup: application
boot: auto
map:
  - share:rw
options:
  username: ""
  password: ""
  category_check: "HNL 332 FO"
  pot_section: "OPEN TIME"
  idle_min_s: 120
  idle_max_s: 600
  hunt_min_s: 20
  hunt_max_s: 60
  yield_cooldown_min: 30
  watch_next_month: true
  my_name: ""
  ctweb_username: ""
  ctweb_password: ""
  second_pilot: ""
  charter_regular: "HNL OGG KOA LIH ITO LAX SFO SAN SEA PDX LAS PHX SMF OAK SJC JFK BOS SYD AKL NRT HND KIX ICN PPG PPT"
  log_level: info
schema:
  username: str
  password: password
  category_check: str
  pot_section: str
  idle_min_s: int(30,7200)
  idle_max_s: int(30,7200)
  hunt_min_s: int(10,600)
  hunt_max_s: int(10,600)
  yield_cooldown_min: int(5,600)
  watch_next_month: bool
  my_name: "str?"
  ctweb_username: "str?"
  ctweb_password: "password?"
  second_pilot: "str?"
  charter_regular: "str?"
  log_level: list(debug|info|warning)
